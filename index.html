
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <title>LinkCard Chat</title>
    <meta name="description" content="A shareable instant chat platform where hosts create interactive media cards (video, audio, calls) that cost credits and feature self-destruct timers and glassmorphism effects." />
    <meta property="og:title" content="LinkCard Chat" />
    <meta property="og:description" content="A shareable instant chat platform where hosts create interactive media cards (video, audio, calls) that cost credits and feature self-destruct timers and glassmorphism effects." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
        height: 100%;
        font-family: 'Inter', sans-serif;
        background-color: #050a14;
        color: white;
      }
      #root {
        width: 100%;
        max-width: 100vw;
        min-height: 100%;
        overflow-x: hidden;
      }
      .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      .sidebar-bg { background-color: #0a111f; }
      .chat-bg { background-color: #050a14; }
      .active-tab { border-bottom: 2px solid #3b82f6; color: white; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
